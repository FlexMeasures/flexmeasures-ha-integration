# Every service takes an optional entry_id, needed only when more than one
# FlexMeasures server is configured. With a single one, it is used implicitly.
change_control_type:
  fields:
    control_type:
      required: true
      default: "NO_SELECTION"
      selector:
        select:
          options:
            - "NO_SELECTION"
            - "FILL_RATE_BASED_CONTROL"
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
trigger_and_get_schedule:
  fields:
    soc_at_start:
      required: true
      selector:
        number:
    flex_model:
      required: false
      selector:
        object:
    flex_context:
      required: false
      selector:
        object:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
post_measurements:
  fields:
    sensor_id:
      required: true
      selector:
        number:
    start:
      required: true
      selector:
        datetime:
    duration:
      required: true
      selector:
        text:
    values:
      required: true
      selector:
        object:
    unit:
      required: true
      selector:
        text:
    prior:
      required: false
      selector:
        datetime:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
send_frbc_instruction:
  fields:
    id:
      required: false
      selector:
        text:
    message_id:
      required: false
      selector:
        text:
    actuator_id:
      required: false
      selector:
        text:
    operation_mode:
      required: false
      selector:
        text:
    operation_mode_factor:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: "slider"
    execution_time:
      required: true
      selector:
          datetime:
    abnormal_condition:
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
get_measurements:
  fields:
    sensor_id:
      required: true
      selector:
        number:
    start:
      required: true
      selector:
        datetime:
    duration:
      required: true
      selector:
        text:
    unit:
      required: true
      selector:
        text:
    resolution:
      required: false
      selector:
        text:
    source:
      required: false
      selector:
        number:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
call_cem_trigger_schedule:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flexmeasures_hacs
